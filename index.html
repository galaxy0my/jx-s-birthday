<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WP-2026-0103 :: 高级复核</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:24px 0;
  background:#070a10;color:#c9d1d9;
  font-family:'Courier New',ui-monospace,monospace;
  min-height:100vh;width:100%;overflow-x:hidden;position:relative;
}

/* ===== 隐藏类（必须最高优先级）===== */
.hd{display:none !important}

/* ===== 背景 ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#131a2a 0%,#070a10 60%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 18s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:#58a6ff;top:-80px;left:-60px}
.orb.b{width:300px;height:300px;background:#f778ba;bottom:-60px;right:-50px;animation-delay:-6s}
.orb.c{width:260px;height:260px;background:#d29922;top:40%;left:55%;animation-delay:-12s;opacity:.2}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-30px) scale(1.15)}
  66%{transform:translate(-30px,25px) scale(.9)}
}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
#sky{position:fixed;inset:0;z-index:9998;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9997;overflow:hidden}

/* ===== 卡片 ===== */
.t{
  position:relative;z-index:3;width:92%;max-width:720px;margin:0 auto;
  padding:26px 22px;border-radius:18px;
  background:rgba(18,23,31,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
}
.h{color:#3fb950;border-bottom:1px solid rgba(255,255,255,.08);
  padding-bottom:12px;margin-bottom:22px;font-size:1.15em;letter-spacing:.5px}

/* ===== 答题样式 ===== */
.q{line-height:1.85;margin-bottom:20px}
.q b{color:#e6edf3}
input{background:rgba(10,14,20,.8);border:1px solid rgba(255,255,255,.12);
  color:#3fb950;padding:12px;width:100%;font-family:inherit;
  margin-top:10px;border-radius:8px;font-size:16px}
input:focus{outline:none;border-color:#3fb950;box-shadow:0 0 0 3px rgba(63,185,80,.15)}
button{background:linear-gradient(135deg,#238636,#2ea043);color:#fff;border:none;
  padding:13px;margin-top:14px;cursor:pointer;font-weight:bold;width:100%;
  border-radius:10px;font-family:inherit;font-size:1em;letter-spacing:1px;
  transition:transform .15s,box-shadow .15s}
button:active{transform:scale(.98)}
button:hover{box-shadow:0 6px 20px rgba(46,160,67,.35)}
.cb{background:rgba(10,14,20,.7);padding:16px;color:#d29922;margin:14px 0;
  border-left:3px solid #d29922;line-height:2;border-radius:6px}
.err{color:#f85149;font-size:.88em;margin-top:6px;display:none}
.lv-tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.72em;
  background:rgba(88,166,255,.15);color:#58a6ff;margin-bottom:10px;letter-spacing:1px}

/* ===== 彩带 ===== */
.confetti{position:absolute;top:-20px;width:9px;height:15px;opacity:0;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translateY(0) rotateX(0) rotateZ(0);opacity:1}
  100%{transform:translateY(105vh) rotateX(720deg) rotateZ(360deg);opacity:.9}
}

/* ============================================
   祝福四段式
   ============================================ */
.fin-wrap{position:relative}
.scene{position:relative;min-height:70vh}

/* 第1段：爱心卡片 */
#heart-box{position:relative;width:100%;height:340px}
.hcard{
  position:absolute;width:46px;height:32px;border-radius:5px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);transform-origin:center;
  animation:flyIn .9s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes flyIn{
  0%{transform:translate(var(--fx),var(--fy)) rotate(180deg) scale(.3);opacity:0}
  100%{transform:translate(0,0) rotate(0) scale(1);opacity:.92}
}

/* 第2段：弹幕 */
#danmaku-box{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dm-card{
  position:absolute;padding:8px 14px;border-radius:8px;
  font-size:.82em;color:#5a4a52;white-space:nowrap;
  box-shadow:0 3px 10px rgba(0,0,0,.18);animation:dmIn .7s ease both;
}
.dm-heart{color:#e0526d;margin-right:5px}
@keyframes dmIn{0%{opacity:0;transform:scale(.4)}100%{opacity:.85;transform:scale(1)}}

/* 中央卡片 */
.center-card{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
  width:min(88%,420px);padding:34px 26px;border-radius:16px;text-align:center;
  background:rgba(255,255,255,.94);color:#4a3a42;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:all .7s cubic-bezier(.2,.9,.3,1.2);z-index:5;
}
.center-card.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.center-card h1{margin:0 0 12px;font-size:2em;color:#c9455f;letter-spacing:2px}
.center-card .heart-ico{color:#e0526d;animation:beat 1.2s ease-in-out infinite;display:inline-block}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.center-card p{margin:0 0 22px;color:#8a7a82;font-size:.95em}
#btn-galaxy{background:linear-gradient(135deg,#f2789f,#e0526d);width:auto;
  padding:11px 26px;border-radius:24px;margin:0}

/* 第3段：星河 */
#scene-galaxy{
  position:relative;min-height:82vh;border-radius:16px;overflow:hidden;
  background:linear-gradient(160deg,#0d1330 0%,#1a1440 45%,#2a1a4a 100%);
}
#scene-galaxy.galaxy-in{animation:galIn 1.2s ease both}
@keyframes galIn{0%{opacity:0;transform:scale(1.06)}100%{opacity:1;transform:none}}
#galaxy-cv{position:absolute;inset:0;width:100%;height:100%}
.galaxy-text{position:absolute;left:6%;top:8%;z-index:3;max-width:60%}
.galaxy-text .en{font-size:.68em;letter-spacing:3px;color:#c9a86a;margin-bottom:10px}
.galaxy-text h1{margin:0 0 10px;font-size:2.2em;color:#fff;letter-spacing:4px;
  text-shadow:0 0 24px rgba(255,255,255,.35)}
.galaxy-text p{margin:0 0 24px;color:#b8c0d8;font-size:.88em}
.galaxy-text h2{margin:0 0 20px;font-size:1.4em;letter-spacing:2px;
  background:linear-gradient(90deg,#ffd166,#f778ba);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#btn-letter{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);
  width:auto;padding:9px 22px;border-radius:20px;margin:0 0 4px;font-size:.85em}
  #btn-letter2{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.3);
  width:auto;padding:9px 22px;border-radius:20px;margin:10px 0 0;font-size:.85em;
  display:block;color:#c9d1d9}


/* 蛋糕 + 光环 */
.cake-stage{position:absolute;right:6%;bottom:14%;z-index:3;text-align:center}
.cake{position:relative;width:190px;margin:0 auto;animation:bob 4.5s ease-in-out infinite;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* 烛台 */
.candle{width:20px;height:44px;margin:0 auto 2px;position:relative;
  background:repeating-linear-gradient(135deg,#fff 0 5px,#ffd9e0 5px 10px);
  border-radius:3px;box-shadow:0 0 10px rgba(255,255,255,.4)}
.flame2{position:absolute;left:50%;top:-19px;transform:translateX(-50%);
  width:13px;height:22px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 74%,#fffdf0,#ffd166 48%,#ff8c42 78%,#ff5e3a);
  box-shadow:0 0 30px 10px rgba(255,190,90,.6),0 0 60px 24px rgba(255,150,80,.25);
  animation:flick .18s ease-in-out infinite alternate}
.flame2::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:5px;height:8px;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(1px)}
@keyframes flick{0%{transform:translateX(-50%) scale(1) rotate(-6deg)}
  100%{transform:translateX(-50%) scale(1.14) rotate(6deg)}}

/* 蛋糕层：奶油顶 + 渐变主体 + 糖珠 */
.tier{margin:0 auto;position:relative;border-radius:6px 6px 4px 4px}
.tier::before{content:'';position:absolute;left:-4px;right:-4px;top:-9px;height:16px;
  border-radius:10px;
  background:linear-gradient(180deg,#fff6f0,#ffe4ec 60%,#f9d3de);
  box-shadow:0 3px 8px rgba(0,0,0,.18)}
.tier::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:
    radial-gradient(circle at 18% 34%,rgba(255,255,255,.55) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 62% 62%,rgba(255,255,255,.4) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 84% 28%,rgba(255,255,255,.35) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 38% 78%,rgba(255,255,255,.3) 0 1.5px,transparent 2.5px);
  background-size:26px 26px,30px 30px,22px 22px,34px 34px}
.t1{width:74px;height:36px;
  background:linear-gradient(180deg,#ff9bb5 0%,#f2789f 55%,#d95f86 100%)}
.t2{width:112px;height:42px;
  background:linear-gradient(180deg,#a8c6ff 0%,#7ea6f0 55%,#5f86d6 100%)}
.t3{width:152px;height:48px;
  background:linear-gradient(180deg,#ffe0a3 0%,#f5c477 55%,#dda85a 100%)}

/* 顶饰樱桃 */
.cherry{position:absolute;left:50%;top:-30px;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#ff8a9b,#e0344f 65%,#a81e35);
  box-shadow:0 0 14px rgba(255,80,110,.7),inset -2px -2px 4px rgba(0,0,0,.25)}
.cherry::before{content:'';position:absolute;left:6px;top:-9px;width:2px;height:10px;
  background:linear-gradient(#7ec850,#4e9a34);border-radius:2px;transform:rotate(12deg)}

/* 托盘 */
.dish{width:196px;height:14px;margin:6px auto 0;border-radius:50%;
  background:linear-gradient(180deg,#fdfbff,#d8d2e6 55%,#b0a8c4);
  box-shadow:0 12px 28px rgba(0,0,0,.55),inset 0 -3px 6px rgba(0,0,0,.18)}
.dish::after{content:'';display:block;width:150px;height:8px;margin:6px auto 0;
  border-radius:50%;background:rgba(0,0,0,.28);filter:blur(6px)}

/* 光环 */
.ring{position:absolute;left:50%;top:52%;border-radius:50%;
  transform:translate(-50%,-50%) rotateX(74deg);animation:spin 10s linear infinite}
.ring.r1{width:250px;height:250px;border:2px solid rgba(255,214,150,.5);
  box-shadow:0 0 22px rgba(255,200,120,.45),inset 0 0 22px rgba(255,200,120,.2)}
.ring.r2{width:310px;height:310px;animation-duration:16s;animation-direction:reverse;
  border:1.5px dashed rgba(180,200,255,.45);
  box-shadow:0 0 18px rgba(160,190,255,.3)}
@keyframes spin{0%{transform:translate(-50%,-50%) rotateX(74deg) rotateZ(0)}
  100%{transform:translate(-50%,-50%) rotateX(74deg) rotateZ(360deg)}}

.happy{margin-top:16px;font-family:'Brush Script MT','Segoe Script',cursive;
  font-size:2.1em;color:#fff;letter-spacing:1px;
  text-shadow:0 0 20px rgba(255,200,220,.7),0 2px 6px rgba(0,0,0,.5)}
.blow{color:#b8c0d8;font-size:.78em;margin-top:4px;letter-spacing:1px}


/* 特效切换按钮 */
.fx-bar{position:absolute;left:0;right:0;bottom:4%;z-index:4;
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 12px}
.fx-btn{width:auto;margin:0;padding:8px 18px;border-radius:20px;font-size:.8em;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
  font-weight:normal;letter-spacing:1px;backdrop-filter:blur(6px)}
.fx-btn.on{background:rgba(255,209,102,.22);border-color:rgba(255,209,102,.6);color:#ffd166}
/* 第4段：信件 */
.letter-mask{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
  justify-content:center;background:rgba(5,8,16,.72);backdrop-filter:blur(6px);animation:fade .4s ease}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
.letter{position:relative;width:min(90%,460px);max-height:78vh;overflow-y:auto;
  padding:30px 28px;border-radius:14px;
  background:linear-gradient(160deg,#fff8f5,#ffeef2 55%,#ffe4ec);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 70px rgba(0,0,0,.7);
  animation:letterIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes letterIn{0%{opacity:0;transform:translateY(24px) scale(.94)}100%{opacity:1;transform:none}}
.letter .close{position:absolute;right:14px;top:12px;width:30px;height:30px;margin:0;
  padding:0;background:transparent;border:none;color:#c96a86;font-size:1.5em;line-height:1}
.letter h3{margin:0 0 18px;color:#d1607e;font-size:1.1em}
.letter p{margin:0 0 14px;line-height:1.95;color:#7a5a63;font-size:.94em;text-indent:2em}
.letter .sign{margin-top:24px;text-align:right;color:#b08a95;font-size:.9em}

@media (max-width:560px){
  .galaxy-text{max-width:100%;left:5%;top:5%}
  .galaxy-text h1{font-size:1.7em}
  .cake-stage{right:50%;transform:translateX(50%);bottom:14%}
  .ring.r1{width:180px;height:180px}
  .ring.r2{width:230px;height:230px}
}
/* 第4段：信件（粉色信纸） */

/* ============ 花饰蛋糕 ============ */
.cake .tier{position:relative}

/* 蜡烛火焰 → 花瓣形 */
.cake.flower-cake .flame{
  border-radius:50% 50% 50% 0 !important;
  transform:rotate(-45deg) !important;
  background:linear-gradient(135deg,#ffd6e0,#ff8fab) !important;
  box-shadow:0 0 18px rgba(255,143,171,.9) !important;
}

/* 小花装饰 */
.mini-flower{
  position:absolute;
  width:16px;height:16px;
  border-radius:50%;
  background:radial-gradient(circle,#fff3b0 20%,#ff8fab 60%,#ff5d8f 100%);
  box-shadow:0 0 8px rgba(255,143,171,.7);
  animation:mfBloom 1s ease-out backwards;
  z-index:5;
}
.mini-flower::before,
.mini-flower::after{
  content:'';position:absolute;inset:0;
  border-radius:50%;
  background:inherit;
}
.mini-flower::before{transform:rotate(45deg) scale(.75)}
.mini-flower::after{transform:rotate(90deg) scale(.75)}
@keyframes mfBloom{
  0%{transform:scale(0);opacity:0}
  70%{transform:scale(1.3)}
  100%{transform:scale(1);opacity:1}
}
.cake.flower-cake .t1 .mf1{left:14px;bottom:100%;animation-delay:.3s}
.cake.flower-cake .t1 .mf2{left:50%;margin-left:-8px;bottom:100%;animation-delay:.45s}
.cake.flower-cake .t1 .mf3{right:14px;bottom:100%;animation-delay:.6s}
.cake.flower-cake .t3 .mf4{left:22px;bottom:70%;animation-delay:.75s}
.cake.flower-cake .t3 .mf5{right:22px;bottom:70%;animation-delay:.9s}

/* 绿叶 */
.leaf{
  position:absolute;
  width:14px;height:8px;
  background:linear-gradient(90deg,#8fd694,#5fa865);
  border-radius:0 100% 0 100%;
  opacity:.9;
  z-index:4;
}
.cake.flower-cake .t1 .lf1{left:34px;bottom:100%;transform:rotate(-25deg)}
.cake.flower-cake .t1 .lf2{right:34px;bottom:100%;transform:rotate(25deg) scaleX(-1)}
.cake.flower-cake .t3 .lf3{left:42px;bottom:70%;transform:rotate(-20deg)}
.cake.flower-cake .t3 .lf4{right:42px;bottom:70%;transform:rotate(20deg) scaleX(-1)}

/* 中层花瓣边 */
.petal-edge{
  position:absolute;
  bottom:100%;
  width:18px;height:14px;
  margin-left:-9px;
  background:linear-gradient(180deg,#ffc2d1,#ff9ebb);
  border-radius:50% 50% 40% 40%;
  transform-origin:50% 100%;
  animation:edgeUp .6s ease-out backwards;
  z-index:4;
}
.cake.flower-cake .t2 .e1{left:8%}
.cake.flower-cake .t2 .e2{left:20%}
.cake.flower-cake .t2 .e3{left:32%}
.cake.flower-cake .t2 .e4{left:44%}
.cake.flower-cake .t2 .e5{left:56%}
.cake.flower-cake .t2 .e6{left:68%}
.cake.flower-cake .t2 .e7{left:80%}
.cake.flower-cake .t2 .e8{left:92%}
.cake.flower-cake .t2 .e1{animation-delay:.15s}
.cake.flower-cake .t2 .e2{animation-delay:.22s}
.cake.flower-cake .t2 .e3{animation-delay:.29s}
.cake.flower-cake .t2 .e4{animation-delay:.36s}
.cake.flower-cake .t2 .e5{animation-delay:.43s}
.cake.flower-cake .t2 .e6{animation-delay:.50s}
.cake.flower-cake .t2 .e7{animation-delay:.57s}
.cake.flower-cake .t2 .e8{animation-delay:.64s}
@keyframes edgeUp{
  0%{transform:scaleY(0);opacity:0}
  100%{transform:scaleY(1);opacity:1}
}

/* 底层藤蔓 */
.vine{
  position:absolute;
  left:10%;right:10%;bottom:60%;
  height:10px;
  border-top:2px solid #8fd694;
  border-radius:50%;
  opacity:.8;
}

/* 蛋糕配色 → 粉色系 */
.cake.flower-cake .t1{background:linear-gradient(180deg,#fff0f5,#ffd9e6) !important}
.cake.flower-cake .t2{background:linear-gradient(180deg,#ffe4ec,#ffc2d4) !important}
.cake.flower-cake .t3{background:linear-gradient(180deg,#ffd6e0,#ffb3c6) !important}
.cake.flower-cake .cherry{
  background:radial-gradient(circle at 30% 30%,#fff3b0,#ffd166) !important;
  box-shadow:0 0 12px rgba(255,209,102,.9) !important;
}

/* 点击许愿动画 */
.flower-cake.blowed .flame{animation:flameOut .5s ease-out forwards}
@keyframes flameOut{
  0%{opacity:1;transform:rotate(-45deg) scale(1)}
  100%{opacity:0;transform:rotate(-45deg) scale(0) translateY(-30px)}
}
.flower-cake.blowed .mini-flower{animation:petalScatter 1.2s ease-out forwards}
@keyframes petalScatter{
  0%{transform:scale(1);opacity:1}
  100%{transform:scale(.3) translate(var(--sx,30px),-80px) rotate(180deg);opacity:0}
}
.flower-cake.blowed .petal-edge{animation:edgeFall 1s ease-in forwards}
@keyframes edgeFall{
  0%{transform:scaleY(1);opacity:1}
  100%{transform:translateY(60px) rotate(90deg);opacity:0}
}

/* ============ 信件（z-index 提到最高） ============ */
.letter-mask{
  position:fixed !important;
  inset:0 !important;
  z-index:9999 !important;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(20,10,25,.75);
  backdrop-filter:blur(6px);
  padding:20px;
}
.letter-mask.hd{display:none !important}
.letter{
  position:relative;
  z-index:10000;
  width:min(90%,420px);
  max-height:80vh;
  overflow-y:auto;
  padding:32px 28px;
  border-radius:18px;
  background:linear-gradient(160deg,#fff8f0,#ffeef5);
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  animation:letterIn .4s ease-out;
}
@keyframes letterIn{
  0%{transform:translateY(40px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.letter .close{
  position:absolute;
  top:12px;right:16px;
  width:32px;height:32px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.08);
  font-size:20px;
  color:#8a6a73;
  cursor:pointer;
  line-height:1;
}
.letter .close:hover{background:rgba(0,0,0,.15)}
.letter h3{
  margin:0 0 16px;
  font-size:22px;
  color:#d1607e;
}
.letter p{
  margin:0 0 12px;
  line-height:1.9;
  font-size:15px;
  color:#6b5560;
}
.letter .sign{
  margin-top:20px;
  text-align:right;
  font-size:14px;
  color:#a88a93;
  font-style:italic;
}

.letter-mask{
  position: fixed;
  inset: 0;
  background: rgba(20,10,30,.75);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}
.letter-mask.hd{ display: none; }
.letter{
  position: relative;
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
  background: linear-gradient(160deg,#fff8f0,#fff0f5);
  border-radius: 18px;
  padding: 34px 28px 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  color: #5a4a52;
  line-height: 1.9;
  font-size: 15px;
}
.letter h3{
  margin: 0 0 18px;
  font-size: 20px;
  color: #d16a8a;
  text-align: center;
  letter-spacing: 2px;
}
.letter .close{
  position: absolute;
  top: 10px;
  right: 14px;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: rgba(209,106,138,.15);
  color: #d16a8a;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

</style>

</head>
<body>

<div class="bg">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div id="stars"></div>
</div>
<canvas id="sky"></canvas>
<div id="fx"></div>

<div class="t">
  <div class="h">&gt; AUDIT_WORKPAPER :: 高级逻辑复核</div>
  <div id="stage"></div>
</div>
  <script src="puzzle.js"></script>
  <script src="finale.js"></script>

    <script>
function bootQuiz(){
  if (typeof renderPuzzle === 'function') {
    var s = document.getElementById('stage');
    if (s && s.innerHTML.length === 0) renderPuzzle(0);
  }
}
window.addEventListener('load', bootQuiz);
setTimeout(bootQuiz, 800);
setTimeout(bootQuiz, 2000);
</script>
<script>
/* ===== 全局错误捕获：报错直接显示在屏幕上 ===== */
window.onerror = function(msg, url, line){
  var box = document.getElementById('errbox');
  if(!box){
    box = document.createElement('div');
    box.id = 'errbox';
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;'+
      'background:#f85149;color:#fff;padding:10px 14px;font-size:12px;'+
      'font-family:monospace;white-space:pre-wrap;max-height:40vh;overflow:auto';
    document.body.appendChild(box);
  }
  box.textContent += '❌ ' + msg + ' (行' + line + ')\n';
};

/* ===== 背景星点 ===== */
(function(){
  var s=document.getElementById('stars');
  for(var i=0;i<70;i++){
    var d=document.createElement('div');
    d.className='star';
    d.style.left=Math.random()*100+'%';
    d.style.top=Math.random()*100+'%';
    d.style.animationDelay=Math.random()*3+'s';
    d.style.opacity=Math.random()*.5+.1;
    s.appendChild(d);
  }
})();

/* ===== 烟花引擎 ===== */
var Fireworks=(function(){
  var cv=document.getElementById('sky'),ctx=cv.getContext('2d');
  var P=[],running=false;
  var COLORS=['#ff6b9d','#ffd166','#06d6a0','#58a6ff','#bc8cff','#ff9e64','#f85149'];
  function resize(){cv.width=innerWidth;cv.height=innerHeight}
  resize();addEventListener('resize',resize);
  function loop(){
    if(!running)return;
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle='rgba(0,0,0,.18)';
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation='lighter';
    for(var i=P.length-1;i>=0;i--){
      var p=P[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.vy*=.985;p.life-=p.decay;
      if(p.life<=0){P.splice(i,1);continue}
      ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(P.length)requestAnimationFrame(loop);
    else{running=false;ctx.clearRect(0,0,cv.width,cv.height)}
  }
  return {
    burst:function(x,y){
      var n=70+Math.floor(Math.random()*40);
      var col=COLORS[Math.floor(Math.random()*COLORS.length)];
      for(var i=0;i<n;i++){
        var a=Math.PI*2*i/n,sp=2+Math.random()*4.5;
        P.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
          life:1,decay:.012+Math.random()*.015,
          col:Math.random()>.75?'#fff':col,r:1+Math.random()*1.8});
      }
      if(!running){running=true;loop()}
    },
    colors:COLORS
  };
})();

/* ===== 彩带 ===== */
function startConfetti(){
  var fx=document.getElementById('fx');
  for(var i=0;i<70;i++){
    var c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.background=Fireworks.colors[Math.floor(Math.random()*Fireworks.colors.length)];
    c.style.animationDuration=(3.5+Math.random()*4)+'s';
    c.style.animationDelay=(Math.random()*7)+'s';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    fx.appendChild(c);
  }
}

/* ===== 启动 ===== */
function boot(){
  var s = document.getElementById('stage');
  if (s && s.innerHTML.trim() === '' && typeof renderPuzzle === 'function') {
    renderPuzzle(0);
  }
}
window.addEventListener('load', boot);
setTimeout(boot, 500);
setTimeout(boot, 1500);
setTimeout(boot, 3000);
</script>
